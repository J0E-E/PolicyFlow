# nginx is the sole public entry point for PolicyFlow. It serves the SPA static
# build and reverse-proxies /api/ requests to the core FastAPI service. core
# publishes no host port (prod parity); this is the only published port.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so the core upstream is resolved per-request
    # rather than once at startup. Without this, nginx fails to boot with
    # "host not found in upstream core" if core is not yet resolvable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback: client routes (Epic 5's /, /select-tenant) resolve to the
    # single-page app instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to core. core is reached by its compose service name
    # on the internal network. The upstream is held in a variable so nginx
    # defers DNS resolution to request time (paired with the resolver above).
    location /api/ {
        set $core_upstream http://core:8000;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

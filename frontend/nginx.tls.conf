# Production TLS entry point for PolicyFlow. Mounted over the dev nginx.conf in
# the docker-compose.prod.yml overlay (not baked into the image), so the base
# image stays HTTP-only for local dev. The domain is hardcoded because this file
# is committed and prod-specific; certbot issues the cert for exactly this name.

# Port 80: serve the ACME HTTP-01 challenge from the certbot webroot, and redirect
# every other request to HTTPS so plain-HTTP traffic never reaches the SPA/API.
server {
    listen 80;
    server_name policyflow.joeyshub.com;

    # Let's Encrypt writes/reads challenge files here during issuance and renewal.
    # This must stay reachable over plain HTTP (no redirect) for HTTP-01 to work.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: the real entry point — TLS termination plus the same SPA + /api/ proxy
# behaviour as the dev nginx.conf.
server {
    listen 443 ssl;
    server_name policyflow.joeyshub.com;

    ssl_certificate     /etc/letsencrypt/live/policyflow.joeyshub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/policyflow.joeyshub.com/privkey.pem;

    # certbot's recommended TLS settings + DH params, both placed in the
    # letsencrypt volume by ops/init-letsencrypt.sh before nginx first boots.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS so the core upstream is resolved per-request rather
    # than once at startup (same deferred-resolution pattern as the dev config).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback: client routes resolve to the single-page app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to core. The upstream is held in a variable so nginx
    # defers DNS resolution to request time (paired with the resolver above).
    location /api/ {
        set $core_upstream http://core:8000;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

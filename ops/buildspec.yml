# CodeBuild recipe (referenced by infra/codebuild.tf via source.buildspec).
# Builds the core + frontend images, tags each with the resolved short commit
# SHA and :latest, and pushes both to ECR. Epic 9's pipeline reuses this same
# buildspec unchanged.
#
# pre_build runs both test suites (backend pytest + frontend vitest) before any
# ECR login or docker build, so a red tree fails the build and no image is pushed.
#
# The repository URLs and region come from CodeBuild environment variables
# (set in infra/codebuild.tf), so no account id is hard-coded here:
#   CORE_REPOSITORY_URL, FRONTEND_REPOSITORY_URL, AWS_DEFAULT_REGION
version: 0.2

phases:
  install:
    runtime-versions:
      python: "3.12"
      nodejs: "20"
  pre_build:
    commands:
      # Test gate — both suites must pass before any ECR login or image build.
      # A non-zero exit here fails the whole build, so no image is pushed from a
      # red tree. Each cd is wrapped in a subshell so the working directory does
      # not leak into the later "docker build core" / "docker build frontend".
      - pip install --quiet --requirement core/requirements.txt --requirement core/requirements-dev.txt
      # The backend suite includes DB-backed tests that boot their own ephemeral
      # Postgres via testcontainers using this build's privileged Docker — the same
      # daemon used by the later "docker build" steps. CodeBuild starts dockerd
      # during environment provisioning (privileged_mode = true in
      # infra/codebuild.tf), so this normally passes immediately; the bounded wait
      # removes any provisioning-race fragility and fails fast with a clear signal
      # if the daemon never comes up. testcontainers is already installed above
      # (it's in core/requirements-dev.txt). No services/sidecar Postgres is used —
      # the substrate always boots its own throwaway container.
      - timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
      - (cd core && python -m pytest -q)
      - (cd frontend && npm ci && npm test --silent)
      # Short commit SHA: first 7 chars of the source version CodeBuild resolves,
      # falling back to "dev" when it is unset (e.g. a local/manual source).
      - SHORT_SHA=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-dev}" | cut -c1-7)
      - echo "Building images tagged with SHORT_SHA=$SHORT_SHA and latest"
      # Log Docker in to ECR using the build role's credentials.
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$CORE_REPOSITORY_URL"
  build:
    commands:
      # core takes a GIT_SHA build-arg (baked into APP_VERSION); frontend does not.
      - docker build --build-arg GIT_SHA="$SHORT_SHA" -t "$CORE_REPOSITORY_URL:$SHORT_SHA" -t "$CORE_REPOSITORY_URL:latest" core
      - docker build -t "$FRONTEND_REPOSITORY_URL:$SHORT_SHA" -t "$FRONTEND_REPOSITORY_URL:latest" frontend
  post_build:
    commands:
      - docker push --all-tags "$CORE_REPOSITORY_URL"
      - docker push --all-tags "$FRONTEND_REPOSITORY_URL"

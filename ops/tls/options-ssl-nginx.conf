# Certbot's recommended nginx TLS settings, committed into the repo and mounted
# into the frontend container (docker-compose.prod.yml) instead of being fetched
# from GitHub at bootstrap — so issuance/deploy has no external download to fail.
# Based on https://ssl-config.mozilla.org (intermediate), trimmed to ECDHE-only
# ciphers so no ssl_dhparam file is required.

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";

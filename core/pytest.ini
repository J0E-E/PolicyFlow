[pytest]
# Async tests run without per-test decorators.
asyncio_mode = auto
# Pin the async fixture event-loop scope so pytest-asyncio does not warn and
# the default stays stable as the suite grows.
asyncio_default_fixture_loop_scope = function
# Discover tests under core/tests.
testpaths = tests
# Make `from app.main import app` resolve when pytest runs from core/.
pythonpath = .

# Alembic configuration for the core service.
#
# The database URL is intentionally left blank here: env.py reads DATABASE_URL
# from the environment (the same variable config.py uses) and rewrites the
# scheme to the synchronous psycopg driver. Migrations run from /app, where the
# Dockerfile copies alembic.ini and the alembic/ directory.

[alembic]
# Path to migration scripts, relative to the working directory (/app).
script_location = alembic

# Prepend the working directory (/app) to sys.path so env.py can `import app.*`.
# The `alembic` command is a console-script entry point, so unlike `python -m`
# the current directory is NOT on sys.path automatically. This is the Alembic
# counterpart to pytest.ini's `pythonpath = .`.
prepend_sys_path = .

# Blank on purpose — env.py supplies the URL from DATABASE_URL at runtime.
sqlalchemy.url =


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

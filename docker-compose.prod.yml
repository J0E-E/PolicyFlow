# Production overlay — adds TLS termination and in-stack cert renewal on top of
# the base docker-compose.yml. The base file stays HTTP-only for local dev; this
# overlay is applied only on the host:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Issuance is a one-time manual bootstrap (ops/init-letsencrypt.sh). Renewal runs
# inside the stack — no host cron — via the certbot service's 12h loop, and nginx
# reloads every 6h to pick up renewed certificates.
services:
  # On the host, pull the freshly-built images from ECR instead of building. The
  # base file keeps build: for local dev; the deploy hook pulls first so up -d
  # uses the pulled image and never builds on the host. CORE_IMAGE/FRONTEND_IMAGE
  # are written into /opt/policyflow/.env by ops/deploy/after_install.sh.
  core:
    image: ${CORE_IMAGE}
    # Always-on host: come back after a crash or a host reboot.
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    # Publish 443 alongside 80. Port 80 now only serves the ACME challenge and
    # redirects to HTTPS (see frontend/nginx.tls.conf).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Swap the HTTP-only dev config for the TLS config (mounted, not baked).
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot's recommended TLS settings, committed and mounted (no download).
      - ./ops/tls/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      # The cert material certbot manages, and the ACME webroot it shares with nginx.
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # Reload nginx every 6h so a running server picks up certs renewed by the
    # certbot sidecar, then hand control to nginx in the foreground.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    healthcheck:
      # The dev :80 check now returns a 301, so probe HTTPS instead. The cert is
      # valid for the public domain, not 127.0.0.1, hence --no-check-certificate.
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://127.0.0.1/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # The no-host-cron renewal seam: a long-lived certbot container that attempts a
  # renewal every 12 hours. certbot only re-issues when a cert is near expiry, so
  # the 12h cadence is safe. nginx (above) reloads on its own 6h timer.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  # Data services live in the base file; the overlay only adds the prod restart
  # policy so the whole stack survives a host reboot (no host-side `compose up`).
  postgres:
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped

volumes:
  # Cert material (certbot writes, nginx reads) and the shared ACME challenge webroot.
  letsencrypt:
  certbot-webroot:
